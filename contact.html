<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eco Espacial - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0b0d17; color: #e0e6ed; margin: 0; padding: 20px;">

    <!-- Menú de navegación -->
    <nav style="background-color: #161b22; padding: 15px; border-radius: 8px; margin-bottom: 30px; text-align: center;">
        <a href="index.html" style="color: #ffffff; text-decoration: none; margin: 0 15px;">Inicio</a>
        <a href="about.html" style="color: #ffffff; text-decoration: none; margin: 0 15px;">Sobre Nosotros</a>
        <a href="contact.html" style="color: #4da6ff; text-decoration: none; font-weight: bold; margin: 0 15px;">Contacto</a>
    </nav>

    <!-- Contenido principal -->
    <main style="max-width: 600px; margin: 0 auto;">
        <h1 style="color: #4da6ff; text-align: center;">Ponte en Contacto</h1>
        <p style="text-align: center; margin-bottom: 30px;">¿Tienes preguntas sobre el espacio o sugerencias? Envíanos un mensaje.</p>
        
        <form style="background-color: #161b22; padding: 25px; border-radius: 8px; border: 1px solid #30363d;">
            <label style="display: block; margin-bottom: 8px;">Nombre:</label>
            <input type="text" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 4px; border: 1px solid #30363d; background-color: #0d1117; color: #fff; box-sizing: border-box;">

            <label style="display: block; margin-bottom: 8px;">Correo Electrónico:</label>
            <input type="email" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 4px; border: 1px solid #30363d; background-color: #0d1117; color: #fff; box-sizing: border-box;">

            <label style="display: block; margin-bottom: 8px;">Mensaje:</label>
            <textarea style="width: 100%; padding: 10px; height: 100px; margin-bottom: 20px; border-radius: 4px; border: 1px solid #30363d; background-color: #0d1117; color: #fff; box-sizing: border-box;"></textarea>

            <button type="button" style="background-color: #238636; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">Enviar Mensaje</button>
        </form>
    </main>

</body>
</html>
